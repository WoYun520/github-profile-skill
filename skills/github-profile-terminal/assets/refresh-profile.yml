name: Refresh profile

on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * *'
  push:
    paths:
      - profile-config.json
      - assets/profile-avatar.txt
      - scripts/render_profile.py
      - .github/workflows/refresh-profile.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update public statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/render_profile.py --update
      - name: Commit the updated card
        run: |
          if ! git diff --quiet -- profile.svg; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add profile.svg
            git commit -m 'Update profile card'
            git push
          fi
